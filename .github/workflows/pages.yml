name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The catalog is built from each product's own README and manifest, so a daily
  # rebuild picks up every release without touching the product repos.
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: read

# Never cancel a main deploy partway; superseded PR runs may be cancelled.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - name: Build the catalog (dry run)
        run: |
          command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg
          node catalog/build.mjs --out "$RUNNER_TEMP/site"
      - name: Badge generator smoke test (25 plugins)
        run: node plugin-inspector/badges.js --out "$RUNNER_TEMP/badge" --limit 25

  # Pages may serve main or gh-pages; publishing the same files to gh-pages keeps
  # either source correct (same pattern as the app repos).
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html stats.js .nojekyll _site/
          cp -r .well-known plugin-inspector pro _site/
      - name: Build the catalog
        run: |
          command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg
          node catalog/build.mjs --out _site
      # One shields.io endpoint JSON per plugin in the Obsidian directory (about a minute for ~10,000).
      # The site is rebuilt from scratch, so a failure here stops the deploy and yesterday's site stays up.
      - name: Build the Plugin Inspector badges
        run: node plugin-inspector/badges.js --out _site/plugin-inspector/badge --budget-min 8
      - name: Publish to gh-pages
        working-directory: _site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      # A push made with GITHUB_TOKEN does not start a Pages build by itself, so ask for one.
      - name: Request a Pages build
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"

  # Live check: the landing page and the asset links file Android verifies.
  live:
    if: github.ref == 'refs/heads/main'
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages and check
        run: |
          base=https://perezamadorluisenrique-gif.github.io
          for i in $(seq 1 20); do
            if curl -fsS "$base/" | grep -q "Hidden Problems Lab" \
              && curl -fsS "$base/plugin-inspector/" | grep -q "Obsidian Plugin Inspector" \
              && curl -fsS "$base/plugin-inspector/inspect.js" | grep -q "checkManifest" \
              && curl -fsS "$base/plugin-inspector/badge/section-numbering.json" | grep -q "Plugin Inspector" \
              && curl -fsS "$base/plugin-inspector/badge/" | grep -q "Add the Plugin Inspector badge" \
              && curl -fsS "$base/catalog/alternatives/" | grep -q "alternatives" \
              && curl -fsS "$base/catalog/" | grep -q "Free tools by Hidden Problems Lab" \
              && curl -fsS "$base/catalog/section-numbering/" | grep -q "Section Numbering" \
              && curl -fsS "$base/sitemap.xml" | grep -q "/catalog/section-numbering/" \
              && curl -fsS "$base/robots.txt" | grep -q "Sitemap:" \
              && curl -fsS "$base/.well-known/assetlinks.json" | python3 -c "import json,sys; assert isinstance(json.load(sys.stdin), list)"; then
              echo "live ok"; curl -sSI "$base/.well-known/assetlinks.json" | grep -i content-type; exit 0
            fi
            sleep 30
          done
          echo "live check failed"; exit 1
